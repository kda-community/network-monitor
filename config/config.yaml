    title: ":helmet_with_white_cross: Chainweb Alert"


ui:
  default-sort-by: group
  title: Kadena Health Dashboard
  header: Kadena
  resolve-successful-conditions: true


default-node-health: &anchorNodeHealth
  group: A - Bootstrap nodes Health
  interval: 30s
  client:
    insecure: true
  conditions:
    - "[CONNECTED] == true"
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 24h"
    - "[BODY].instance == mainnet01"
    - "has([BODY].hashes) == true"

other-node-health: &anchorOtherNodeHealth
  group: Z - Other important nodes Health
  interval: 30s
  client:
    insecure: true
  conditions:
    - "[CONNECTED] == true"
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 24h"
    - "[BODY].instance == mainnet01"
    - "has([BODY].hashes) == true"


default-node up-to-date: &nodeUpToData
  group: B - Bootstrap nodes Recent Cut
  interval: 30s
  url: http://localhost:8090/age
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
  conditions:
    - "[STATUS] == 200"
    - "[BODY].age[0] < 300"
    - "[BODY].age[1] < 300"
    - "[BODY].age[2] < 300"
    - "[BODY].age[3] < 300"
    - "[BODY].age[4] < 300"
    - "[BODY].age[5] < 300"
    - "[BODY].age[6] < 300"
    - "[BODY].age[7] < 300"
    - "[BODY].age[8] < 300"
    - "[BODY].age[9] < 300"
    - "[BODY].age[10] < 300"
    - "[BODY].age[11] < 300"
    - "[BODY].age[12] < 300"
    - "[BODY].age[13] < 300"
    - "[BODY].age[14] < 300"
    - "[BODY].age[15] < 300"
    - "[BODY].age[16] < 300"
    - "[BODY].age[17] < 300"
    - "[BODY].age[18] < 300"
    - "[BODY].age[19] < 300"



simple-frontend: &simpleFrontend
  group: D - Frontends
  interval: 2m
  conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 24h"

discord-alert: &general-discord
  alerts:
    - type: discord
      enabled: true
      failure-threshold: 10
      minimum-reminder-interval: 24h

ping-everyone: &ping-everyone-discord
  alerts:
    - type: discord
      enabled: true
      failure-threshold: 10
      minimum-reminder-interval: 24h
      provider-override:
        message-content: "@everyone"

ping-pascal: &ping-pascal-discord
