      - <<: *ping-pascal-discord

  - name: pl-1 Recent Blocks
    <<: *nodeUpToData
    body: 'node=https://pl-1.chainweb-community.org'
    alerts:
      - <<: *ping-pascal-discord

  - name: pl-2 Health
