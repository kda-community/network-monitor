suites:
  - name: Kinesis kb-ETH Collateral

    group: F - Kinesis
    interval: 5m
    endpoints:
      - name: Kinesis kb-ETH Reserve
        <<: *general-discord
        method: POST
        ui:
          resolve-successful-conditions: true
        url: http://localhost:8090/eth_balance_gwei
        headers:
          Content-Type: application/x-www-form-urlencoded
        body: 'address=0xbddB58bF21b12D70eED91b939Ae061572010B11d'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].balance != 0.0"
        store:
          reserve: "[BODY].balance"

      - name: Kinesis kb-ETH Supply < Reserve
        <<: *ping-everyone-discord
        url: http://localhost:8090/pact
        ui:
          resolve-successful-conditions: true
        method: POST
        headers:
          Content-Type: application/json
        body: '{"chains":[2],"cmd":"(use free.util-math)(use n_e595727b657fbbb3b8e362a05a7bb8d12865c1ff.kb-ETH)(round (* 1000000000.0  (sum (map (at \"balance\") (select accounts (where \"balance\" (< 0.0) ))))) 0)"}'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].results[0] < [CONTEXT].reserve"

  - name: Kinesis kb-USDC Collateral

    group: F - Kinesis
    interval: 5m
    endpoints:
      - name: Kinesis kb-USDC Reserve
        <<: *general-discord
        method: POST
        ui:
          resolve-successful-conditions: true
        url: http://localhost:8090/erc_20_balance

        headers:
          Content-Type: application/x-www-form-urlencoded
        body: 'token=0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48&address=0x81C2813aa88F66bca1e55838045Aaceb72FEbFc1'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].balance != 0.0"
        store:
          reserve: "[BODY].balance"

      - name: Kinesis kb-USDC Supply < Reserve
        <<: *ping-everyone-discord
        url: http://localhost:8090/pact
        ui:
          resolve-successful-conditions: true
        method: POST
        headers:
          Content-Type: application/json
        body: '{"chains":[2],"cmd":"(use free.util-math)(use n_e595727b657fbbb3b8e362a05a7bb8d12865c1ff.kb-USDC)(round (* 1000000.0  (sum (map (at \"balance\") (select accounts (where \"balance\" (< 0.0) ))))) 0)"}'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].results[0] < [CONTEXT].reserve"


  - name: Hyperlane Message Dispatch Eth to KDA (not Fatal)
    group: E - Hyperlane
    interval: 30m
    endpoints:
      - name: Hyperlane Eth MailBox Last-Dispatch-ID
        <<: *general-discord
        group: F - Kinesis
        method: POST
        ui:
          resolve-successful-conditions: true
        url: http://localhost:8090/latest_dispatch_id

        headers:
          Content-Type: application/x-www-form-urlencoded
        body: 'address=0x82A729A4c7B2aeBDdbFCCF533e7B75c61c45c23c'
        conditions:
          - "[STATUS] == 200"
          - "has([BODY].id) == true"
        store:
          latest_id: "[BODY].id"

      - name: KDA Dispatch ID delivery
        <<: *general-discord
        group: F - Kinesis
        url: http://localhost:8090/pact
        ui:
          resolve-successful-conditions: true
        method: POST
        headers:
          Content-Type: application/json
        body: '{"chains":[2],"cmd":"(n_e595727b657fbbb3b8e362a05a7bb8d12865c1ff.mailbox.delivered (int-to-str 64 (str-to-int 16 \"[CONTEXT].latest_id\")))"}'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].results[0] == true"

  - name: Hyperlane Message Dispatch KDA to Eth (not Fatal)
    group: E - Hyperlane
    interval: 30m
    endpoints:
      - name:  Hyperlane KDA MailBox Last-Dispatch-ID
        <<: *general-discord
        url: http://localhost:8090/pact
        ui:
          resolve-successful-conditions: true
        method: POST
        headers:
          Content-Type: application/json
        body: '{"chains":[2],"cmd":"(use n_e595727b657fbbb3b8e362a05a7bb8d12865c1ff.mailbox)(int-to-str 16 (str-to-int 64 (at \"latest-dispatched-id\" (read contract-state \"default\"))))"}'
        conditions:
          - "[STATUS] == 200"
          - "has([BODY].results[0]) == true"
          - "[BODY].results[0] != ''"
        store:
          latest_id: "[BODY].results[0]"

      - name:  Eth Dispatch ID delivery
        <<: *general-discord
        method: POST
        ui:
          resolve-successful-conditions: true
        url: http://localhost:8090/mailbox_delivered
        headers:
          Content-Type: application/x-www-form-urlencoded
        body: 'address=0x82A729A4c7B2aeBDdbFCCF533e7B75c61c45c23c&id=[CONTEXT].latest_id'
        conditions:
          - "[STATUS] == 200"
          - "[BODY].delivered == true"
