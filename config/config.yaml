web:
  address: 127.0.0.1
  port: 8064

storage:
  type: sqlite
  path: gatus_data.db
  maximum-number-of-results: 2000
  maximum-number-of-events: 20

alerting:
  discord:
# Test server
#    webhook-url: "https://discord.com/api/webhooks/1554894267972059136/Ar6CP5u74iYcgpV4rVKg2g9oXPj7aQn_EbiZyzYHvp2UPvR30EITuf-kKGNCPTxsCphn"
# Team server
    webhook-url: "https://discord.com/api/webhooks/1555216735643238413/V6VHp_-krvvFfUo-Ibxg5S3HgzgTWUlUWPiotzyBc7ynzwz9_ronco9rmEOIgg4IUVXf"
    title: ":helmet_with_white_cross: Chainweb Alert"


ui:
  default-sort-by: group
  title: Kadena Health Dashboard
  header: Kadena
  resolve-successful-conditions: true


get-kadena-merkle-tree-height: &merkleKdaRefHeight
  name: Kadena Merkle Tree height
  url: http://localhost:8090/pact
  ui:
    resolve-successful-conditions: true
  method: POST
  headers:
    Content-Type: application/json
  body: '{"chains":[2],"cmd":"(- (n_e595727b657fbbb3b8e362a05a7bb8d12865c1ff.merkle-tree-hook.count) 1)"}'
  conditions:
    - "[STATUS] == 200"
    - "has([BODY].results[0].int) == true"
    - "[BODY].results[0].int != ''"
  store:
    tree_count: "[BODY].results[0].int"

get-eth-merkle-tree-height: &merkleEthRefheight
  name: Eth Merkle tree height
  method: POST
  ui:
    resolve-successful-conditions: true
  url: http://localhost:8090/tree_hook_count

  headers:
    Content-Type: application/x-www-form-urlencoded
  body: 'address=0xbB7e89E1C475cB02769FfCD8845e5B0B3343ecb7'
  conditions:
    - "[STATUS] == 200"
    - "[BODY].count > 0"
  store:
    tree_count: "[BODY].count"

get-s3-height: &s3Height
  name: S3 Tree Height
  method: GET
  ui:
    resolve-successful-conditions: true
  conditions:
    - "[STATUS] == 200"
    - "[BODY] ==  [CONTEXT].tree_count"


default-node-health: &anchorNodeHealth
  group: A - Bootstrap nodes Health
  interval: 30s
  client:
    insecure: false
  conditions:
    - "[CONNECTED] == true"
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 24h"
    - "[BODY].instance == mainnet01"
    - "has([BODY].hashes) == true"

other-node-health: &anchorOtherNodeHealth
  group: Z - Other important nodes Health
  interval: 5m
  client:
    insecure: true
  conditions:
    - "[CONNECTED] == true"
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 24h"
    - "[BODY].instance == mainnet01"
    - "has([BODY].hashes) == true"

default-node up-to-date: &nodeUpToData
  group: B - Bootstrap nodes Recent Cut
  interval: 30s
  url: http://localhost:8090/age
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
  conditions:
    - "[STATUS] == 200"
    - "[BODY].age[0] < 300"
    - "[BODY].age[1] < 300"
    - "[BODY].age[2] < 300"
    - "[BODY].age[3] < 300"
    - "[BODY].age[4] < 300"
    - "[BODY].age[5] < 300"
    - "[BODY].age[6] < 300"
    - "[BODY].age[7] < 300"
    - "[BODY].age[8] < 300"
    - "[BODY].age[9] < 300"
    - "[BODY].age[10] < 300"
    - "[BODY].age[11] < 300"
    - "[BODY].age[12] < 300"
    - "[BODY].age[13] < 300"
    - "[BODY].age[14] < 300"
    - "[BODY].age[15] < 300"
    - "[BODY].age[16] < 300"
    - "[BODY].age[17] < 300"
    - "[BODY].age[18] < 300"
    - "[BODY].age[19] < 300"


simple-frontend: &simpleFrontend
  group: D - Frontends
  interval: 2m
  conditions:
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 24h"

discord-alert: &general-discord
  type: discord
  enabled: true
  failure-threshold: 10
  minimum-reminder-interval: 24h

ping-everyone: &ping-everyone-discord
