endpoints:
  - name: Mnitoring Gateway
    group: "0 - Monitoring Gateway"
    url: http://localhost:8090/
    method: GET
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
      - "[BODY] == OK"

  - name: pl-1 Health
    <<: [*anchorNodeHealth, *ping-everyone-discord]
    url: "https://pl-1.chainweb-community.org/chainweb/0.0/mainnet01/cut"

  - name: pl-1 Recent Blocks
    <<: [*nodeUpToData, *ping-pascal-discord]
    body: 'node=https://pl-1.chainweb-community.org'

  - name: pl-2 Health
    <<: [*anchorNodeHealth, *ping-pascal-discord]
    url: "https://pl-2.chainweb-community.org/chainweb/0.0/mainnet01/cut"

  - name: pl-2 Recent Blocks
    <<: [*nodeUpToData, *ping-pascal-discord]
    body: 'node=https://pl-2.chainweb-community.org'

  - name: nl-1 Health
